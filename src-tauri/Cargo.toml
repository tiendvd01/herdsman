[package]
name = "herdsman"
version = "0.1.0"
description = "Herdsman — GUI quản lý agent theo Project → Workspace → Session"
edition = "2021"

[lib]
name = "herdsman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"
thiserror = "2"
parking_lot = "0.12"

tempfile = "3"
portable-pty = "0.9"
shell-words = "1"
# spec 071: MCP secrets in Keychain
keyring = { version = "3", features = ["apple-native"] }

# spec 010: list installed font families for Settings → Appearance.
[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "block2"] }

# Dock icon in `tauri dev` (no .app bundle → macOS shows a generic icon).
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"
[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = ["NSData"]
[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = ["NSApplication", "NSImage", "NSResponder"]
